name: validate

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install cfn-lint pyyaml shellcheck-py
      - name: Local checks
        run: make test
      - name: ShellCheck
        run: shellcheck -S warning bin/lab scripts/*.sh scripts/lib/*.sh
