AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab 11 broken template. It passes validation but fails during update because
  the VPC does not exist, which forces UPDATE_ROLLBACK_COMPLETE.

Parameters:
  ProjectName:
    Type: String
    Default: soa-c03
  ExpiryDate:
    Type: String
    Default: "2026-12-01"

Resources:
  LabQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-lab11-queue"
      MessageRetentionPeriod: 3600
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ExpiryDate, Value: !Ref ExpiryDate}

  LabBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-lab11-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ExpiryDate, Value: !Ref ExpiryDate}

  QueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/lab11/queue-url"
      Type: String
      Value: !Ref LabQueue
      Tags:
        Project: !Ref ProjectName
        ExpiryDate: !Ref ExpiryDate

  BrokenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: This VPC does not exist, so the update must roll back.
      VpcId: vpc-03a3584329e94b60e

Outputs:
  QueueUrl:
    Value: !Ref LabQueue
  BucketName:
    Value: !Ref LabBucket
  QueueUrlParameterName:
    Value: !Ref QueueUrlParameter
